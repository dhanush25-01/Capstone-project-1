<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Security - DhanushMart</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
    <a class="logo" href="/">DhanushMart</a>
    <nav>
        <a href="/user/dashboard">Dashboard</a>
        <a href="/products">Store</a>
        <a href="/user/profile">Profile</a>
        <a href="/user/change-password">Security</a>
        <a href="/user/logout" th:if="${session.user != null}">Logout</a>
    </nav>
</header>

<div class="formbox security-box">
    <span class="eyebrow">ACCOUNT SECURITY</span>
    <h2>Change Password</h2>
    <p class="muted">Use a strong password that you do not reuse elsewhere.</p>

    <p class="success" th:if="${success}" th:text="${success}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form method="post" action="/user/change-password">
        <label>Current Password</label>
        <input name="currentPassword" type="password" required>

        <label>New Password</label>
        <input name="newPassword" type="password" minlength="6" required>

        <label>Confirm New Password</label>
        <input name="confirmPassword" type="password" minlength="6" required>

        <button class="btn" type="submit">Update Password</button>
    </form>
</div>
</body>
</html>
