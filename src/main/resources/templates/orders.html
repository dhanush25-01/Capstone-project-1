<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>My Orders</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><a class="logo" href="/">DhanushMart</a><nav><a href="/products">Products</a><a href="/cart">Cart</a><a href="/logout" th:if="${session.customer != null}">Logout</a></nav></header>
<div class="container"><h2>My Orders</h2><div class="order" th:each="o:${orders}"><h3>Order #<span th:text="${o.id}"></span></h3><p>Date: <span th:text="${o.orderDate}"></span></p><p>Status: <b th:text="${o.status}"></b></p><p>Total: ₹<span th:text="${o.totalAmount}"></span></p><p>Address: <span th:text="${o.shippingAddress}"></span></p><ul><li th:each="i:${o.items}" th:text="${i.product.name+' x '+i.quantity+' - ₹'+i.price}"></li></ul></div></div></body></html>
