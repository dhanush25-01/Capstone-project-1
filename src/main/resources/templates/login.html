<!DOCTYPE html><html><head><title>Customer Login</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><a class="logo" href="/">DhanushMart</a></header>
<div class="formbox"><h2>Customer Login</h2><p class="error" th:if="${error}" th:text="${error}"></p><p class="success" th:if="${param.registered}">Registration successful. Please login.</p>
<form method="post" action="/login"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="btn">Login</button></form>
<p>New customer? <a href="/register">Create account</a></p></div></body></html>
