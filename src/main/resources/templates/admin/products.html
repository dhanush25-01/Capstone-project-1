<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Admin Products</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><a class="logo" href="/admin/dashboard">DhanushMart Admin</a><nav><a href="/admin/dashboard">Dashboard</a><a href="/admin/products">Products</a><a href="/admin/customers">Customers</a><a href="/admin/orders">Orders</a><a href="/admin/logout" th:if="${session.admin != null}">Logout</a></nav></header>
<div class="container"><h2>Products</h2><a class="btn" href="/admin/products/add">Add Product</a><table><tr><th>ID</th><th>Name</th><th>Price</th><th>Size</th><th>Stock</th><th>Category</th><th>Actions</th></tr><tr th:each="p:${products}"><td th:text="${p.id}"></td><td th:text="${p.name}"></td><td th:text="${p.price}"></td><td th:text="${p.size}"></td><td th:text="${p.stock}"></td><td th:text="${p.category.name}"></td><td><a th:href="@{'/admin/products/edit/'+${p.id}}">Edit</a><form style="display:inline" method="post" th:action="@{'/admin/products/delete/'+${p.id}}"><button>Delete</button></form></td></tr></table></div></body></html>
