<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Edit Product</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><a class="logo" href="/admin/dashboard">DhanushMart Admin</a></header><div class="formbox"><h2>Edit Product</h2>
<form method="post" action="/admin/products/save" th:object="${product}"><input type="hidden" th:field="*{id}"><input th:field="*{name}" required><textarea th:field="*{description}"></textarea><input th:field="*{price}" type="number" step="0.01" required><input th:field="*{size}"><input th:field="*{color}"><input th:field="*{stock}" type="number" required><input th:field="*{image}"><select name="categoryId" required><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${product.category != null && product.category.id == c.id}"></option></select><button class="btn">Update</button></form></div></body></html>
