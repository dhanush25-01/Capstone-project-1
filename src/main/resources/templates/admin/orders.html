<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Orders</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><a class="logo" href="/admin/dashboard">DhanushMart Admin</a><nav><a href="/admin/dashboard">Dashboard</a><a href="/admin/products">Products</a><a href="/admin/customers">Customers</a><a href="/admin/logout" th:if="${session.admin != null}">Logout</a></nav></header><div class="container"><h2>Orders</h2><table><tr><th>ID</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th>Update</th></tr><tr th:each="o:${orders}"><td th:text="${o.id}"></td><td th:text="${o.customer.email}"></td><td th:text="${o.orderDate}"></td><td th:text="${o.totalAmount}"></td><td th:text="${o.status}"></td><td><form method="post" th:action="@{'/admin/orders/status/'+${o.id}}"><select name="status"><option>PLACED</option><option>PACKED</option><option>SHIPPED</option><option>DELIVERED</option><option>CANCELLED</option></select><button>Update</button></form></td></tr></table></div></body></html>
