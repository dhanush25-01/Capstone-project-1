<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Create User</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><a class="logo" href="/admin/dashboard">DhanushMart Admin</a></header><div class="formbox"><h2>Create User Account</h2><p class="error" th:if="${error}" th:text="${error}"></p>
<form method="post" action="/admin/users/save" th:object="${user}"><input th:field="*{name}" placeholder="Full name" required><input th:field="*{username}" placeholder="Username" required><input th:field="*{password}" type="password" placeholder="Password" required><input th:field="*{email}" type="email" placeholder="Email"><input th:field="*{phone}" placeholder="Phone"><button class="btn">Create User</button></form></div></body></html>
