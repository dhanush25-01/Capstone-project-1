<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Add Product</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><a class="logo" href="/admin/dashboard">DhanushMart Admin</a></header><div class="formbox"><h2>Add Product</h2>
<form method="post" action="/admin/products/save" th:object="${product}"><input th:field="*{name}" placeholder="Product name" required><textarea th:field="*{description}" placeholder="Description"></textarea><input th:field="*{price}" type="number" step="0.01" placeholder="Price" required><input th:field="*{size}" placeholder="Size"><input th:field="*{color}" placeholder="Color"><input th:field="*{stock}" type="number" placeholder="Stock" required><input th:field="*{image}" placeholder="Image file name"><select name="categoryId" required><option value="">Select category</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}"></option></select><button class="btn">Save</button></form></div></body></html>
