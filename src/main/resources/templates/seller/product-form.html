<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title th:text="${product.id == null ? 'Add Product' : 'Edit Product'} + ' - Seller Portal'">Seller Product</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><a class="logo" href="/seller/dashboard">DhanushMart Seller</a><nav><a href="/seller/dashboard">Dashboard</a><a href="/seller/logout">Logout</a></nav></header>
<div class="formbox"><h2 th:text="${product.id == null ? 'Add Product' : 'Edit Product'}">Product</h2><p class="error" th:if="${error}" th:text="${error}"></p>
<form method="post" action="/seller/products/save" th:object="${product}"><input type="hidden" th:field="*{id}"><input th:field="*{name}" placeholder="Product name" required><textarea th:field="*{description}" placeholder="Description"></textarea><input th:field="*{price}" type="number" min="0" step="0.01" placeholder="Price" required><input th:field="*{size}" placeholder="Size"><input th:field="*{color}" placeholder="Color"><input th:field="*{stock}" type="number" min="0" placeholder="Stock" required><input th:field="*{image}" placeholder="Image file name or image path"><select name="categoryId" required><option value="">Select category</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${product.category != null && product.category.id == c.id}"></option></select><button class="btn" th:text="${product.id == null ? 'Add Product' : 'Save Changes'}">Save</button><a class="btn btn-light" href="/seller/dashboard">Cancel</a></form>
<p>Note: enter an existing image path or filename. This form does not upload image files.</p></div></body></html>
