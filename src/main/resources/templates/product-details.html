<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Product</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><a class="logo" href="/">DhanushMart</a><nav><a href="/products">Products</a><a href="/cart">Cart</a></nav></header>
<div class="detail"><div class="imagebox large"><img th:if="${product.image != null && !#strings.isEmpty(product.image)}" th:src="@{${product.image.startsWith('/') ? product.image : '/images/' + product.image}}" th:alt="${product.name}" onerror="this.onerror=null;this.src='/images/product-placeholder.svg';"><span th:if="${product.image == null || #strings.isEmpty(product.image)}" th:text="${product.name}"></span></div><div><h2 th:text="${product.name}"></h2><p th:text="${product.description}"></p><h3>₹<span th:text="${product.price}"></span></h3><p>Size: <span th:text="${product.size}"></span></p><p>Color: <span th:text="${product.color}"></span></p><p>Stock: <span th:text="${product.stock}"></span></p>
<form method="post" action="/cart/add"><input type="hidden" name="productId" th:value="${product.id}"><input type="number" name="quantity" value="1" min="1" th:max="${product.stock}" required><button class="btn" th:disabled="${product.stock == 0}">Add to Cart</button></form></div></div></body></html>
