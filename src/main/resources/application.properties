spring.application.name=DhanushMart
server.port=${PORT:8080}

# Cloud MySQL credentials are configured in Render Environment Variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Update existing tables automatically. Import database/dhanushmart.sql separately if you need its sample data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf templates are packaged in the JAR; enable caching in deployment.
spring.thymeleaf.cache=true
server.error.whitelabel.enabled=false

# Optional AI image search. Set OPENAI_API_KEY in Render only if this feature is used.
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
